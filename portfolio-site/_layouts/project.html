---
layout: default
---
<article>
  <div class="doc-header">
    <p class="card-meta">{{ page.period }}</p>
    <h1>{{ page.title }}</h1>
    <p class="lede" style="color: var(--ink-soft);">{{ page.summary }}</p>
    {% if page.tags %}<div class="tags">{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>{% endif %}
    <p class="doc-links">
      {% if page.repo %}<a href="{{ page.repo }}">Code &rarr;</a>{% endif %}
      {% if page.demo %}<a href="{{ page.demo }}">Demo &rarr;</a>{% endif %}
      {% if page.paper %}<a href="{{ page.paper }}">Write-up / paper &rarr;</a>{% endif %}
    </p>
  </div>
  <div class="doc-body">
    {{ content }}
  </div>
</article>
