---
layout: default
---
<article>
  <div class="doc-header">
    <p class="card-meta">{{ page.date | date: "%B %Y" }}{% if page.reading_time %} · {{ page.reading_time }} min read{% endif %}</p>
    <h1>{{ page.title }}</h1>
    <p class="lede" style="color: var(--ink-soft);">{{ page.summary }}</p>
    {% if page.related_project %}
    <p class="doc-links"><a href="{{ page.related_project | relative_url }}">Related project &rarr;</a></p>
    {% endif %}
  </div>
  <div class="doc-body">
    {{ content }}
  </div>
</article>
